<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico da Rifa</title>
<style>
  :root{
    --paper:#faf6f1; --card:#fff; --ink:#2f2a26; --ink-soft:#5d544c; --ink-faint:#8c8178;
    --line:#e8ded3; --ok:#1f7a4d; --ok-bg:#e8f6ee; --bad:#b03030; --bad-bg:#fdeceb;
    --wait:#8a6d1f; --wait-bg:#fdf5e0; --accent:#8a6a4f;
  }
  *{box-sizing:border-box}
  body{margin:0; padding:20px 16px 40px; background:var(--paper); color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; line-height:1.5;}
  .wrap{max-width:560px; margin:0 auto}
  h1{font-size:21px; margin:0 0 4px}
  .sub{color:var(--ink-faint); font-size:13.5px; margin:0 0 20px}
  .t{background:var(--card); border:1px solid var(--line); border-radius:12px;
     padding:13px 14px; margin-bottom:10px}
  .t .top{display:flex; align-items:center; gap:9px}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--ink-faint); flex:0 0 auto}
  .t.ok .dot{background:var(--ok)} .t.bad .dot{background:var(--bad)} .t.wait .dot{background:var(--wait)}
  .t.ok{background:var(--ok-bg)} .t.bad{background:var(--bad-bg)} .t.wait{background:var(--wait-bg)}
  .nome{font-weight:600; font-size:14.5px; flex:1}
  .tag{font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase}
  .t.ok .tag{color:var(--ok)} .t.bad .tag{color:var(--bad)} .t.wait .tag{color:var(--wait)}
  .det{margin:8px 0 0; font-size:12.5px; color:var(--ink-soft); word-break:break-word;
       font-family:ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap}
  .veredito{background:#fff; border:2px solid var(--accent); border-radius:12px;
            padding:15px; margin:18px 0 12px; font-size:14.5px}
  .veredito b{display:block; margin-bottom:5px; font-size:15px}
  button{width:100%; padding:13px; border:0; border-radius:11px; background:var(--accent);
         color:#fff; font-size:15px; font-weight:600; font-family:inherit; cursor:pointer}
  button:active{opacity:.85}
  .nota{font-size:12px; color:var(--ink-faint); margin-top:14px; text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>Diagnóstico da Rifa do Arthur</h1>
  <p class="sub">Esta página só <b>lê</b> informações. Não altera, não apaga e não grava nada no banco.</p>
  <div id="testes"></div>
  <div class="veredito" id="veredito" style="display:none"></div>
  <button id="btnCopiar">Copiar resultado</button>
  <p class="nota">Depois de copiar, cole no chat para eu ver o erro exato.</p>
</div>

<script>
const CONFIG_FIREBASE = {
  apiKey: "AIzaSyBnkWLHMwT4nZBPd5SBdVmdJtVFRx4Mnpk",
  authDomain: "rifa-arthur-f24dc.firebaseapp.com",
  projectId: "rifa-arthur-f24dc",
  storageBucket: "rifa-arthur-f24dc.firebasestorage.app",
  messagingSenderId: "348274332018",
  appId: "1:348274332018:web:f96771a0846f78bfb80deb"
};
const BASE_ATUAL = 'https://www.gstatic.com/firebasejs/10.12.2/';
const BASE_NOVA  = 'https://www.gstatic.com/firebasejs/11.0.2/';

const elTestes = document.getElementById('testes');
const linhas = [];

function addTeste(id, nome){
  const d = document.createElement('div');
  d.className = 't wait'; d.id = 't-'+id;
  d.innerHTML = '<div class="top"><span class="dot"></span><span class="nome"></span>'
              + '<span class="tag">testando</span></div><p class="det" style="display:none"></p>';
  d.querySelector('.nome').textContent = nome;
  elTestes.appendChild(d);
  return d;
}
function marcar(id, ok, detalhe){
  const d = document.getElementById('t-'+id);
  d.className = 't ' + (ok ? 'ok' : 'bad');
  d.querySelector('.tag').textContent = ok ? 'ok' : 'falhou';
  if(detalhe){
    const p = d.querySelector('.det');
    p.style.display = 'block';
    p.textContent = detalhe;
  }
  linhas.push((ok?'[OK]   ':'[FALHA] ') + d.querySelector('.nome').textContent
              + (detalhe ? '\n        ' + detalhe.replace(/\n/g,'\n        ') : ''));
  return ok;
}
function erroTexto(e){
  if(!e) return 'erro sem descrição';
  const partes = [];
  if(e.code) partes.push('code=' + e.code);
  if(e.name && e.name !== 'Error') partes.push(e.name);
  partes.push(e.message || String(e));
  return partes.join(' | ');
}

(async function(){
  // ---- ambiente ----
  addTeste('amb', 'Ambiente do navegador');
  marcar('amb', navigator.onLine,
    'online=' + navigator.onLine
    + '\nendereço=' + location.href
    + '\nnavegador=' + navigator.userAgent);

  // ---- alcance bruto do gstatic ----
  addTeste('rede', 'Servidor do Google (gstatic.com) responde?');
  let redeOk = false, redeDet = '';
  try{
    const r = await fetch(BASE_ATUAL + 'firebase-app.js', {cache:'no-store'});
    redeOk = r.ok;
    redeDet = 'HTTP ' + r.status + ' ' + r.statusText;
    if(r.ok){
      const txt = await r.text();
      redeDet += '\ntamanho=' + txt.length + ' caracteres';
    }
  }catch(e){
    redeDet = erroTexto(e) + '\n(conexão recusada, bloqueio de rede ou DNS)';
  }
  marcar('rede', redeOk, redeDet);

  // ---- import da versão usada hoje ----
  addTeste('v1', 'Carregar Firebase 10.12.2 (versão usada no site)');
  let mods = null, v1Det = '';
  try{
    mods = await Promise.all([
      import(BASE_ATUAL + 'firebase-app.js'),
      import(BASE_ATUAL + 'firebase-firestore.js'),
      import(BASE_ATUAL + 'firebase-auth.js')
    ]);
    v1Det = 'os 3 módulos carregaram';
  }catch(e){ v1Det = erroTexto(e); }
  const v1 = marcar('v1', !!mods, v1Det);

  // ---- import de uma versão mais nova (para saber se é problema da versão) ----
  addTeste('v2', 'Carregar Firebase 11.0.2 (versão alternativa)');
  let v2 = false, v2Det = '';
  try{
    await import(BASE_NOVA + 'firebase-app.js');
    v2 = true; v2Det = 'carregou';
  }catch(e){ v2Det = erroTexto(e); }
  marcar('v2', v2, v2Det);

  // ---- iniciar o app ----
  let app = null;
  if(v1){
    addTeste('init', 'Iniciar o projeto rifa-arthur-f24dc');
    try{
      app = mods[0].initializeApp(CONFIG_FIREBASE);
      marcar('init', true, 'projeto=' + CONFIG_FIREBASE.projectId);
    }catch(e){ marcar('init', false, erroTexto(e)); }
  }

  // ---- leitura dos números (SOMENTE LEITURA) ----
  if(app){
    addTeste('ler', 'Ler os números no banco (somente leitura)');
    try{
      const fs = mods[1];
      const db = fs.getFirestore(app);
      const snap = await fs.getDocs(fs.collection(db, 'numeros'));
      let reservados = 0, confirmados = 0, livres = 0;
      snap.forEach(d=>{
        const s = (d.data() || {}).status;
        if(s === 'confirmado') confirmados++;
        else if(s === 'reservado') reservados++;
        else livres++;
      });
      marcar('ler', true,
        'documentos=' + snap.size
        + '\nconfirmados=' + confirmados
        + '\nreservados=' + reservados
        + '\noutros/livres=' + livres);
    }catch(e){
      marcar('ler', false, erroTexto(e));
    }

    addTeste('auth', 'Serviço de login (Authentication) responde?');
    try{
      const au = mods[2];
      au.getAuth(app);
      marcar('auth', true, 'serviço iniciado (não foi tentado nenhum login)');
    }catch(e){ marcar('auth', false, erroTexto(e)); }
  }

  // ---- veredito ----
  const vd = document.getElementById('veredito');
  let texto;
  if(!redeOk && !v1 && !v2){
    texto = '<b>A rede está bloqueando o servidor do Google.</b>'
          + 'Nenhuma versão do Firebase carregou. Teste em outra rede (4G em vez de Wi-Fi) '
          + 'ou em outro aparelho. Se só falhar numa rede específica, é filtro/firewall dessa rede.';
  } else if(!v1 && v2){
    texto = '<b>A versão 10.12.2 saiu do ar e a 11.0.2 funciona.</b>'
          + 'Me manda este resultado que eu atualizo o site para a versão nova.';
  } else if(v1){
    texto = '<b>O Firebase carregou normalmente agora.</b>'
          + 'Se o site continuar zerado, me manda este resultado — o número de confirmados '
          + 'acima mostra se os dados estão no banco.';
  } else {
    texto = '<b>Falha parcial.</b>Me manda este resultado para eu identificar a causa.';
  }
  vd.innerHTML = texto;
  vd.style.display = 'block';
  linhas.push('\nVEREDITO: ' + vd.textContent.trim());
})();

document.getElementById('btnCopiar').addEventListener('click', async ()=>{
  const txt = 'DIAGNÓSTICO RIFA DO ARTHUR\n' + new Date().toLocaleString('pt-BR')
            + '\n\n' + linhas.join('\n');
  const btn = document.getElementById('btnCopiar');
  try{
    await navigator.clipboard.writeText(txt);
    btn.textContent = 'Copiado!';
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:60vh;font-size:12px';
    document.body.appendChild(ta); ta.select();
    btn.textContent = 'Copie o texto acima manualmente';
  }
  setTimeout(()=>{ btn.textContent = 'Copiar resultado'; }, 2500);
});
</script>
</body>
</html>
